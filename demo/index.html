<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token demo</title>
    <link rel="stylesheet" href="../dist/tokens.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="module" src="demo.js"></script>
  </head>
  <body>
    <!-- The page sets no mode, so it follows the reader's setting. Every panel sets its own.
         demo.js fills this with panels for no brand and for each brand in dist/brands.json,
         which npm run build writes from tokens/brands/, so this page names no brand.
         Each panel comes once for each language in copy.json, the page's own first. -->
    <main class="panels">
      <p class="panel-label">Building the panels from dist/brands.json and copy.json. If this stays, run npm run demo, which builds the tokens and serves this page.</p>
    </main>

    <!-- The card every panel shows. demo.js copies it, and sets data-brand on a copy where a case needs one.
         Its words are in copy.json: demo.js puts the string named by each data-copy in the panel's
         language, and gives a list one item per string, each with the tick. The price is typed here for now. -->
    <template id="card">
      <article class="card">
        <header class="card-head">
          <h3 class="plan" data-copy="plans.studio.name"></h3>
          <span class="tag" data-copy="plans.studio.tag"></span>
        </header>
        <p class="lede" data-copy="plans.studio.pitch"></p>
        <p class="price"><span class="amount">$24</span> <span data-copy="card.unit"></span></p>
        <ul class="features" data-copy="plans.studio.features">
          <li><svg class="tick" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.25l2.25 2.25 4.75-5" /></svg></li>
        </ul>
        <button class="button" type="button" data-copy="plans.studio.cta"></button>
        <a class="link" href="#" data-copy="card.compare"></a>
      </article>
    </template>
  </body>
</html>
