<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token demo</title>
    <link rel="stylesheet" href="../dist/tokens.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="module" src="demo.js"></script>
  </head>
  <body>
    <!-- The page sets no mode, so it follows the reader's setting. Every panel sets its own.
         demo.js fills this with panels for no brand and for each brand in dist/brands.json,
         which npm run build writes from tokens/brands/, so this page names no brand.
         Each panel comes once for each language in copy.json, the page's own first. -->
    <main class="panels">
      <p class="panel-label">Building the panels from dist/brands.json and copy.json. If this stays, run npm run demo, which builds the tokens and serves this page.</p>
    </main>

    <!-- The card every panel shows. demo.js copies it, and sets data-brand on a copy where a case needs one.
         Its words are in copy.json: demo.js puts the string named by each data-copy in the panel's
         language, and gives a list one item per string, each with the tick. The button's label has a span
         of its own, so filling it in keeps the arrow after it. The price slot, data-price, stays empty:
         the price is data in demo.js, which formats it for the panel's language and puts it here.
         npm run check fails if anything is typed in it. -->
    <template id="card">
      <article class="card">
        <header class="card-head">
          <h3 class="plan" data-copy="plans.studio.name"></h3>
          <span class="tag" data-copy="plans.studio.tag"></span>
        </header>
        <p class="lede" data-copy="plans.studio.pitch"></p>
        <p class="price"><span class="amount" data-price></span> <span data-copy="card.unit"></span></p>
        <ul class="features" data-copy="plans.studio.features">
          <li><svg class="tick" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.25l2.25 2.25 4.75-5" /></svg></li>
        </ul>
        <!-- The arrow is drawn pointing forward in English and named for where it leads, not for
             a side: demo.css turns every icon whose name ends in -forward or -back around in Arabic. -->
        <button class="button" type="button">
          <span data-copy="plans.studio.cta"></span>
          <svg class="icon" data-icon="arrow-forward" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 8h10M9 4l4 4-4 4" /></svg>
        </button>
        <a class="link" href="#" data-copy="card.compare"></a>
      </article>
    </template>

    <!-- The status panels' card: for each status, a badge on its solid fill and a short notice on
         its soft fill, inside its border. demo.css gives each data-status its own tokens, and
         demo.js fills the words from copy.json, as for the card above. A brand never re-points a
         status, so these come out the same colours in every brand's panel. -->
    <template id="statuses">
      <article class="card statuses">
        <div class="status" data-status="success">
          <span class="badge" data-copy="status.success.badge"></span>
          <p class="notice" data-copy="status.success.message"></p>
        </div>
        <div class="status" data-status="warning">
          <span class="badge" data-copy="status.warning.badge"></span>
          <p class="notice" data-copy="status.warning.message"></p>
        </div>
        <div class="status" data-status="critical">
          <span class="badge" data-copy="status.critical.badge"></span>
          <p class="notice" data-copy="status.critical.message"></p>
        </div>
        <div class="status" data-status="info">
          <span class="badge" data-copy="status.info.badge"></span>
          <p class="notice" data-copy="status.info.message"></p>
        </div>
      </article>
    </template>
  </body>
</html>
