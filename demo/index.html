<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token demo</title>
    <link rel="stylesheet" href="../dist/tokens.css" />
    <link rel="stylesheet" href="demo.css" />
    <script type="module" src="demo.js"></script>
  </head>
  <body>
    <!-- The page sets no mode, so it follows the reader's setting. Every panel sets its own.
         demo.js fills this with panels for no brand and for each brand in dist/brands.json,
         which npm run build writes from tokens/brands/, so this page names no brand. -->
    <main class="panels">
      <p class="panel-label">Building the panels from dist/brands.json. If this stays, run npm run demo, which builds the tokens and serves this page.</p>
    </main>

    <!-- The card every panel shows. demo.js copies it, and sets data-brand on a copy where a case needs one. -->
    <template id="card">
      <article class="card">
        <header class="card-head">
          <h3 class="plan">Studio</h3>
          <span class="tag">Most popular</span>
        </header>
        <p class="lede">For small teams that ship every week.</p>
        <p class="price"><span class="amount">$24</span> per seat, per month</p>
        <ul class="features">
          <li><svg class="tick" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.25l2.25 2.25 4.75-5" /></svg>Unlimited projects and reviewers</li>
          <li><svg class="tick" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.25l2.25 2.25 4.75-5" /></svg>A shared component library</li>
          <li><svg class="tick" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.25l2.25 2.25 4.75-5" /></svg>Review links with comments</li>
        </ul>
        <button class="button" type="button">Start a 14-day trial</button>
        <a class="link" href="#">Compare plans</a>
      </article>
    </template>
  </body>
</html>
